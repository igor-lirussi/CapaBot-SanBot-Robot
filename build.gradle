buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url "https://jitpack.io" }
        // jcenter()
        maven { url "https://maven.google.com" } // Gradle < 4.0
        maven {
            name 'Sonatype SNAPSHOTs'
            url 'https://oss.sonatype.org/content/repositories/snapshots/'
        }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.5.4'
        configurations {
            all*.exclude group: 'com.google.code.gson'
        }
    }
}

apply plugin: 'com.android.application'

android {
    compileSdkVersion 33

    defaultConfig {
        multiDexEnabled true
        applicationId "com.sanbot.capaBot"
        minSdkVersion 19
        targetSdkVersion 26
        versionCode 202610284
        versionName "6.0.5-googletts" //change also proprieties.txt in Hari folder, config

        android.defaultConfig.javaCompileOptions.annotationProcessorOptions.includeCompileClasspath = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    // Modern NDKs dropped the arm-linux-androideabi strip toolchain AGP 3.5 expects.
    packagingOptions {
        doNotStrip '**/*.so'
    }

    // Native libs live in src/main/jniLibs (not libs/, which also holds jars/AARs).
}

// AGP 3.5 strip task needs legacy NDK toolchains we don't have; keep unstripped .so.
tasks.whenTaskAdded { task ->
    if (task.name != null && task.name.toLowerCase().contains("strip") && task.name.toLowerCase().contains("debugsymbols")) {
        task.enabled = false
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
    mavenCentral()
    google()
        maven { url "https://jitpack.io" }
    // jcenter()
    maven { url "https://maven.google.com" } // Gradle < 4.0
    maven {
        name 'Sonatype SNAPSHOTs'
        url 'https://oss.sonatype.org/content/repositories/snapshots/'
    }
    maven {
        url 'http://nexus.bippo.co.id/nexus/content/groups/public/net/reduls/'
    }
/*
    maven {
        //for aiml
        url 'http://nexus.bippo.co.id/nexus/content/groups/public/'
    }
     */
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    androidTestImplementation('com.android.support.test.espresso:espresso-core:2.2.2', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation "com.android.support:appcompat-v7:26.1.0"
    testImplementation 'junit:junit:4.12'
    implementation 'com.jakewharton:butterknife:8.8.1'
    annotationProcessor 'com.jakewharton:butterknife-compiler:8.8.1'

    //sanbotsuff
    implementation(name: 'SanbotOpenSDK_2.0.1.10', ext: 'aar')
    //implementation 'com.google.code.gson:gson:2.8.2'
    //implementation files('libs/gson-2.2.4.jar')

    //icalendar 4 java
    implementation 'org.mnode.ical4j:ical4j:2.2.4'
    // required icalendar
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '1.7.26'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.7'
    implementation group: 'org.apache.commons', name: 'commons-collections4', version: '4.0'
    implementation group: 'javax.cache', name: 'cache-api', version: '1.1.0'
    //for calendar
    implementation 'com.github.alamkanak:android-week-view:1.2.6'
    //aiml
    implementation 'joda-time:joda-time:2.10.3'
    implementation 'io.apisense:rhino-android:1.1.1'
    implementation 'org.jbundle.util.osgi.wrapped:org.jbundle.util.osgi.wrapped.org.apache.http.client:4.1.2'
    implementation files('libs/sanmoku-0.0.5.jar')
    implementation files('libs/sanmoku-feature-ex-0.0.1.jar')

}
